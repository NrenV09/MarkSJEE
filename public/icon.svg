<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="url(#accent)" stroke-width="6" stroke-opacity="0.35" fill="none" />

  <!-- Target grid subtle circle -->
  <circle cx="256" cy="256" r="170" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="100" stroke="#10b981" stroke-width="2" stroke-opacity="0.2" />

  <!-- Dynamic 'M' with Mathematical Sigma & Checkmark -->
  <path d="M128 368V144L256 264L384 144V368" stroke="url(#accent)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Integral / Sigma accent -->
  <circle cx="256" cy="336" r="24" fill="#10b981" />
  <path d="M246 336L253 343L268 328" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sparkle stars representing rank / success -->
  <path d="M380 120L385 135L400 140L385 145L380 160L375 145L360 140L375 135Z" fill="#38bdf8" />
  <path d="M130 380L133 390L143 393L133 396L130 406L127 396L117 393L127 390Z" fill="#818cf8" />
